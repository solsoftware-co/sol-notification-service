name: Release

on:
  push:
    branches: [main]

jobs:
  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npm run type-check

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npm test

  # Cuts a semantic-release version from Conventional Commit history on every
  # merge to main: bumps package.json, updates CHANGELOG.md, tags the commit,
  # and publishes a GitHub Release. Never publishes to npm (package is private).
  #
  # Uses RELEASE_GH_TOKEN (a PAT from a repo admin), not the default GITHUB_TOKEN:
  # @semantic-release/git pushes the release commit straight to main, which the
  # default token can't do past the required "ci-gate" status check. Admins bypass
  # that check (enforce_admins is off), so a PAT from an admin account can push.
  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [type-check, test]
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_GH_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_GH_TOKEN }}

      # package.json is bumped locally by semantic-release before it pushes
      # the release commit, so this reflects the version just released (or
      # the current version unchanged, if this run had nothing to release).
      # Downstream deploy jobs tag their Vercel deployments with it via --meta.
      - name: Read released version
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

  # Deploys the release cut by the `release` job above to the persistent
  # "staging" Vercel Custom Environment (bound to main, its own env vars, its
  # own stable URL — a physically separate deployment/env-var set from
  # Production, not just a filtered view of it). Runs the full e2e suite
  # against it before deploy-production is allowed to run.
  #
  # Vercel's git-triggered auto-deploys are fully disabled (see
  # vercel.json → git.deploymentEnabled: false) — this workflow is the only
  # thing that ever creates a deployment. The CLI remains unaffected by that
  # setting.
  deploy-staging:
    name: Deploy Staging
    runs-on: ubuntu-latest
    needs: [release]
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npm install --global vercel@latest

      # Source of truth for staging config is GitHub Secrets; this keeps
      # Vercel's env store in sync rather than requiring manual dashboard
      # edits. --force makes it safe to re-run on every push.
      - name: Sync staging environment variables
        run: |
          vercel env add SOL_API_URL staging --value "${{ secrets.SOL_API_URL_STAGING }}" --yes --force --non-interactive < /dev/null
          vercel env add SOL_API_KEY staging --value "${{ secrets.SOL_API_KEY_STAGING }}" --yes --force --non-interactive < /dev/null
          vercel env add INNGEST_EVENT_KEY staging --value "${{ secrets.INNGEST_EVENT_KEY_STAGING }}" --yes --force --non-interactive < /dev/null
          vercel env add INNGEST_SIGNING_KEY staging --value "${{ secrets.INNGEST_SIGNING_KEY_STAGING }}" --yes --force --non-interactive < /dev/null

      # This job checks out the main branch, so VERCEL_GIT_COMMIT_REF would
      # read "main" — the Inngest SDK falls back to that for branch-
      # environment naming (no INNGEST_ENV set), which put every staging
      # deploy's functions in an Inngest environment literally called "main",
      # colliding with nothing in particular but naming nothing "staging"
      # either. Setting INNGEST_ENV explicitly (highest-priority override —
      # see node_modules/inngest/helpers/env.js) gives staging its own
      # correctly-named Inngest environment.
      - name: Deploy to staging
        id: deploy
        run: |
          DEPLOY_URL=$(vercel deploy --target=staging --env INNGEST_ENV=staging --meta version="${{ needs.release.outputs.version }}" --yes --non-interactive < /dev/null 2>&1 | grep -Eo 'https://[a-zA-Z0-9.-]+\.vercel\.app' | tail -1)
          echo "url=$DEPLOY_URL" >> "$GITHUB_OUTPUT"

      - name: Sync Inngest app with staging deployment
        env:
          INNGEST_SIGNING_KEY_STAGING: ${{ secrets.INNGEST_SIGNING_KEY_STAGING }}
        run: |
          curl -s -w "\nHTTP %{http_code}" -X PUT "${{ steps.deploy.outputs.url }}/api/inngest" \
            -H "Content-Type: application/json" || true
          curl -s -w "\nHTTP %{http_code}" \
            -X POST "https://api.inngest.com/fn/register" \
            -H "Authorization: Bearer ${INNGEST_SIGNING_KEY_STAGING}" \
            -H "Content-Type: application/json" \
            -d "{\"url\": \"${{ steps.deploy.outputs.url }}/api/inngest\"}" || true
          sleep 20

      - name: Run full e2e suite against staging
        run: npm run test:e2e
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
          INNGEST_ENV: ${{ github.ref_name }}
          INNGEST_EVENT_KEY_STAGING: ${{ secrets.INNGEST_EVENT_KEY_STAGING }}
          INNGEST_SIGNING_KEY_STAGING: ${{ secrets.INNGEST_SIGNING_KEY_STAGING }}
          MAILTRAP_API_TOKEN: ${{ secrets.MAILTRAP_API_TOKEN }}
          MAILTRAP_ACCOUNT_ID: ${{ secrets.MAILTRAP_ACCOUNT_ID }}
          MAILTRAP_INBOX_ID: ${{ secrets.MAILTRAP_INBOX_ID }}

  # Gated by the "production" GitHub Environment — requires manual approval
  # (see repo Settings → Environments → production) before this job starts.
  # Deploys the same commit that was just verified on staging.
  deploy-production:
    name: Deploy Production
    runs-on: ubuntu-latest
    needs: [deploy-staging, release]
    environment: production
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npm install --global vercel@latest

      # Only sol-api credentials are synced here — INNGEST_EVENT_KEY /
      # INNGEST_SIGNING_KEY for Production are managed by the Inngest Vercel
      # integration itself (see CLAUDE.md), not this workflow.
      - name: Sync production environment variables
        run: |
          vercel env add SOL_API_URL production --value "${{ secrets.SOL_API_URL_PRODUCTION }}" --yes --force --non-interactive < /dev/null
          vercel env add SOL_API_KEY production --value "${{ secrets.SOL_API_KEY_PRODUCTION }}" --yes --force --non-interactive < /dev/null

      - name: Deploy to production
        id: deploy
        run: |
          DEPLOY_URL=$(vercel deploy --prod --meta version="${{ needs.release.outputs.version }}" --yes --non-interactive < /dev/null 2>&1 | grep -Eo 'https://[a-zA-Z0-9.-]+\.vercel\.app' | tail -1)
          echo "url=$DEPLOY_URL" >> "$GITHUB_OUTPUT"

      # "Auto-assign Custom Production Domains" is disabled for this project
      # (previously, every push to main auto-promoted straight to production,
      # bypassing this whole staged/approved pipeline). With it off, a
      # `vercel deploy --prod` build no longer automatically becomes the live
      # site — it must be explicitly promoted.
      #
      # Unlike `vercel deploy`, `vercel promote` does not honor VERCEL_ORG_ID /
      # VERCEL_PROJECT_ID — it resolves scope purely from the token's default
      # team, which isn't necessarily this project's team. --scope is required.
      - name: Promote deployment to production domain
        run: vercel promote "${{ steps.deploy.outputs.url }}" --scope "$VERCEL_ORG_ID" --yes
