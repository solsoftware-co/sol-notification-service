name: E2E Email Tests

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read
  deployments: read
  statuses: read

jobs:
  # ── Step 1: Detect which email flows were affected by this PR ─────────────
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      weekly-analytics: ${{ steps.filter.outputs.weekly-analytics }}
      form-notification: ${{ steps.filter.outputs.form-notification }}
      shared: ${{ steps.filter.outputs.shared }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            weekly-analytics:
              - 'src/inngest/functions/analytics-report.ts'
              - 'src/inngest/functions/weekly-analytics-scheduler.ts'
            form-notification:
              - 'src/inngest/functions/form-notification.ts'
            shared:
              - 'src/lib/email.ts'
              - 'src/lib/config.ts'
              - 'src/lib/notifications.ts'
              - 'src/lib/templates.ts'
              - 'src/lib/excel.ts'
              - 'src/inngest/functions/index.ts'
              - 'src/types/index.ts'

  # ── Step 1b: Sync sol-api creds into Vercel's Preview environment ──────────
  # GitHub Secrets are the source of truth; this pushes them into Vercel so
  # nobody has to hand-type values into the Vercel dashboard. Preview points
  # at sol-api's staging deployment — same credentials the persistent
  # "staging" custom environment uses post-merge.
  # Note: Vercel's own automatic Preview build is triggered independently of
  # this workflow, so there's a narrow race on a *brand new* PR if Vercel
  # finishes building before this job finishes syncing. Values persist once
  # set, so this only bites (rarely) on the very first run — pushing another
  # commit to the PR picks up the already-synced values.
  sync-preview-env:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_3BeW3i0ok6rNli9su37BjZ9n
      VERCEL_PROJECT_ID: prj_BRk7QsxbHKRUKmDvygDFQN6ijKfF
    steps:
      - run: npm install --global vercel@latest
      - name: Sync SOL_API_URL / SOL_API_KEY into Preview
        run: |
          vercel env add SOL_API_URL preview --value "${{ secrets.SOL_API_URL_STAGING }}" --yes --force --non-interactive < /dev/null
          vercel env add SOL_API_KEY preview --value "${{ secrets.SOL_API_KEY_STAGING }}" --yes --force --non-interactive < /dev/null

  # ── Step 2: Wait for Vercel Preview deployment to be ready ────────────────
  wait-for-deployment:
    needs: [detect-changes, sync-preview-env]
    # Only wait if at least one email flow is affected
    if: |
      needs.detect-changes.outputs.weekly-analytics == 'true' ||
      needs.detect-changes.outputs.form-notification == 'true' ||
      needs.detect-changes.outputs.shared == 'true'
    runs-on: ubuntu-latest
    outputs:
      url: ${{ steps.wait.outputs.url }}
    steps:
      - name: Wait for Vercel Preview deployment
        id: wait
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          SHA="${{ github.event.pull_request.head.sha }}"
          for i in $(seq 1 30); do
            RESULT=$(curl -s "https://api.vercel.com/v6/deployments?meta-githubCommitSha=${SHA}&limit=5" \
              -H "Authorization: Bearer ${VERCEL_TOKEN}")
            URL=$(echo "$RESULT" | jq -r '.deployments[] | select(.state=="READY") | .url' | head -1)
            if [ -n "$URL" ]; then
              echo "url=https://${URL}" >> $GITHUB_OUTPUT
              echo "Found deployment: https://${URL}"
              exit 0
            fi
            echo "Waiting for deployment... (attempt $i/30)"
            sleep 10
          done
          echo "Timed out waiting for Vercel deployment"
          exit 1

      - name: Sync Inngest app with Preview deployment
        env:
          INNGEST_SIGNING_KEY_STAGING: ${{ secrets.INNGEST_SIGNING_KEY_STAGING }}
        run: |
          PREVIEW_URL="${{ steps.wait.outputs.url }}"
          echo "=== Step 1: PUT to app sync endpoint ==="
          curl -s -w "\nHTTP %{http_code}" -X PUT "${PREVIEW_URL}/api/inngest" \
            -H "Content-Type: application/json" || true

          echo ""
          echo "=== Step 2: POST to Inngest Cloud registration API ==="
          curl -s -w "\nHTTP %{http_code}" \
            -X POST "https://api.inngest.com/fn/register" \
            -H "Authorization: Bearer ${INNGEST_SIGNING_KEY_STAGING}" \
            -H "Content-Type: application/json" \
            -d "{\"url\": \"${PREVIEW_URL}/api/inngest\"}" || true

          echo ""
          echo "Waiting 20s for sync to propagate..."
          sleep 20

  # ── Step 3a: Run weekly analytics e2e tests (if affected) ─────────────────
  e2e-weekly-analytics:
    needs: [detect-changes, wait-for-deployment]
    if: |
      always() &&
      needs.wait-for-deployment.result == 'success' &&
      (needs.detect-changes.outputs.weekly-analytics == 'true' ||
       needs.detect-changes.outputs.shared == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - name: Run weekly analytics e2e tests
        run: npm run test:e2e -- weekly-analytics --reporter=verbose
        env:
          PREVIEW_URL: ${{ needs.wait-for-deployment.outputs.url }}
          INNGEST_ENV: ${{ github.head_ref }}
          INNGEST_EVENT_KEY_STAGING: ${{ secrets.INNGEST_EVENT_KEY_STAGING }}
          INNGEST_SIGNING_KEY_STAGING: ${{ secrets.INNGEST_SIGNING_KEY_STAGING }}
          MAILTRAP_API_TOKEN: ${{ secrets.MAILTRAP_API_TOKEN }}
          MAILTRAP_ACCOUNT_ID: ${{ secrets.MAILTRAP_ACCOUNT_ID }}
          MAILTRAP_INBOX_ID: ${{ secrets.MAILTRAP_INBOX_ID }}

  # ── Step 3b: Run form notification e2e tests (if affected) ────────────────
  e2e-form-notification:
    needs: [detect-changes, wait-for-deployment]
    if: |
      always() &&
      needs.wait-for-deployment.result == 'success' &&
      (needs.detect-changes.outputs.form-notification == 'true' ||
       needs.detect-changes.outputs.shared == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - name: Run form notification e2e tests
        run: npm run test:e2e -- form-notification --reporter=verbose
        env:
          PREVIEW_URL: ${{ needs.wait-for-deployment.outputs.url }}
          INNGEST_ENV: ${{ github.head_ref }}
          INNGEST_EVENT_KEY_STAGING: ${{ secrets.INNGEST_EVENT_KEY_STAGING }}
          INNGEST_SIGNING_KEY_STAGING: ${{ secrets.INNGEST_SIGNING_KEY_STAGING }}
          MAILTRAP_API_TOKEN: ${{ secrets.MAILTRAP_API_TOKEN }}
          MAILTRAP_ACCOUNT_ID: ${{ secrets.MAILTRAP_ACCOUNT_ID }}
          MAILTRAP_INBOX_ID: ${{ secrets.MAILTRAP_INBOX_ID }}

  # ── Step 4: Gate — the ONLY required status check on main ─────────────────
  # Succeeds if all upstream jobs passed OR were skipped (no relevant files changed).
  # Set ONLY this job as required in branch protection settings.
  ci-gate:
    needs: [sync-preview-env, e2e-weekly-analytics, e2e-form-notification]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Write job summary
        run: |
          SYNC="${{ needs.sync-preview-env.result }}"
          WA="${{ needs.e2e-weekly-analytics.result }}"
          FN="${{ needs.e2e-form-notification.result }}"

          status_icon() {
            case "$1" in
              success)  echo "✅" ;;
              skipped)  echo "⏭️" ;;
              failure)  echo "❌" ;;
              *)        echo "⚠️" ;;
            esac
          }

          cat >> $GITHUB_STEP_SUMMARY << EOF
          ## E2E Email Test Results

          | Flow | Status |
          |------|--------|
          | Sync Preview Env | $(status_icon $SYNC) \`$SYNC\` |
          | Weekly Analytics | $(status_icon $WA) \`$WA\` |
          | Form Notification | $(status_icon $FN) \`$FN\` |

          **Branch:** \`${{ github.head_ref }}\` · **Commit:** \`${{ github.event.pull_request.head.sha }}\`
          > Skipped flows had no changed files — gate passes automatically.
          EOF

      - name: Check all required jobs passed or were skipped
        run: |
          echo '${{ toJSON(needs) }}' | jq -e '
            [.[] | .result] | all(. == "success" or . == "skipped")
          '
